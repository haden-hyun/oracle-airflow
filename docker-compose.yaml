# Airflow 3.3.2 (LocalExecutor) — 운영 값은 .env 로 주입
# 기본값은 안전 쪽 (127.0.0.1:8081, 토큰 발급 금지, 비 prod = *_staging DB 만 쓰기)
name: airflow3

x-airflow-common:
  &airflow-common
  image: local/airflow3:3.3.2-py3.12
  pull_policy: never
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${META_DB_PASSWORD:?META_DB_PASSWORD required}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?FERNET_KEY required}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:?JWT secret required}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:?API secret key required}
    AIRFLOW__API__BASE_URL: ${AIRFLOW__API__BASE_URL:-http://localhost:8081}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: 'false'
    TOKEN_DIR: /opt/airflow/data/tokens
    TOKEN_ISSUE_ENABLED: ${TOKEN_ISSUE_ENABLED:-false}
    ASSET_FLOW_ENV: ${ASSET_FLOW_ENV:-test}
  volumes:
    &airflow-common-volumes
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    # KIS 토큰 캐시 (tokens.json)
    - ${TOKEN_HOST_DIR:-./data/tokens}:/opt/airflow/data/tokens:${TOKEN_MOUNT_MODE:-rw}
  user: "${AIRFLOW_UID:?AIRFLOW_UID required}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: ${GREEN_RESTART_POLICY:-unless-stopped}
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # Airflow 메타DB (호스트 포트 미노출)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${META_DB_PASSWORD:?META_DB_PASSWORD required}
      POSTGRES_DB: airflow
    volumes:
      - pgdata16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: ${GREEN_RESTART_POLICY:-unless-stopped}

  # 최초 1회: DB 스키마 생성(migrate) + 관리자 계정 생성 후 종료
  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:?admin username required}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:?admin password required}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_HOST_BIND:-127.0.0.1}:${AIRFLOW_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      <<: *airflow-common-env
      ASSET_FLOW_SECRETS: /opt/airflow/secrets/asset_flow.secrets.yaml
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ${TOKEN_HOST_DIR:-./data/tokens}:/opt/airflow/data/tokens:${TOKEN_MOUNT_MODE:-rw}
      # secrets는 태스크가 실행되는 scheduler에만, 디렉터리째 읽기 전용
      - ./secrets:/opt/airflow/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # deferrable 미사용 → 기본 비활성. 필요 시 --profile triggerer
  airflow-triggerer:
    <<: *airflow-common
    profiles: ["triggerer"]
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata16:
