# 비밀 아닌 설정 (커밋 대상). 계좌 단위 값·키는 secrets/asset_flow.secrets.yaml

tables:
  asset_daily:         {schema: account, table_name: asset_daily}
  exchange_rate_daily: {schema: market,  table_name: exchange_rate_daily}
  fund_price_daily:    {schema: market,  table_name: fund_price_daily}
  product:             {schema: market,  table_name: product}
  product_price_daily: {schema: market,  table_name: product_price_daily}
  dividend_event:      {schema: market,  table_name: dividend_event}
  dividend_receipt:    {schema: account, table_name: dividend_receipt}
  index_daily:         {schema: market,  table_name: index_daily}

funds:
  pension_fund_code: K553W5E17401            # kind=kis_pension_fund 기본값 (계좌별 fund_code 로 override)
  crawl_codes: [K553W5E17401, K55105D43299]  # 항상 수집 (계좌·유형 펀드는 런타임에 합집합)
  crawler_fallback: true                     # KOFIA 에 없는 코드만 fundguide 크롤링 (크롤러 제거 전까지)
  shadow_compare: true                       # 전환 검증: 매일 크롤러 값과 대조, 다르면 실패 알림

manual_asset_types:                          # 키 = account_master.account_type
  IRP:                  {product_code: K55105D43299, multiplier: 0.001}
  DC:                   {product_code: K55105D43299, multiplier: 0.001}
  # 현금성: product_code 없음
  INSTALLMENT_SAVINGS:  {product_code: null, multiplier: 1.0}
  HOUSING_SUBSCRIPTION: {product_code: null, multiplier: 1.0}

credential_check:                            # API 키 만료 알림 규칙
  stage_days: [14, 7]                        # 단계 알림
  daily_from: 3                              # D-3 부터 매일 (만료 후 포함)
  window: 14                                 # 구간 내 월요일 따라잡기

dashboard:                                   # 대시보드 저장소 소유 객체 (Airflow 는 이름만 앎)
  refresh_procedure: dashboard.refresh_views # 적재 DAG 마지막 태스크가 CALL — MV 갱신 + 갱신 기록

price_ingest:                                # market_ingest_product_price_daily (매일 07:10)
  lookback_days: 365                         # 신규·재매수 시 최대 이만큼 거슬러 받음
  refetch_trading_days: 5                    # 매일 최근 n 거래일 재수집 (정정·누락)
  tracked_after_sale_days: 30                # 매도 후 n 일까지 is_tracked
  request_interval_sec: 0.35                 # 업비트·KOFIA 호출 간격 (KIS 는 KIS.REQUEST_INTERVAL)
  fund_nav_enabled: true                     # KOFIA 펀드 기준가 과거 빈 날짜 보충 (DO NOTHING)

dividend:                                    # account_ingest_dividend (매일 07:20)
  windows:                                   # 기준 = run 의 KST 날짜(T), 단위 일
    kr_event_back: 400                       # 국내 일정 T−400 ~ T+60 (TTM + 작년 같은 달 투영)
    kr_event_forward: 60
    us_event_back: 400                       # 미국 일정 T−400 ~ T+120 (권리종합은 공시일 기준)
    us_event_forward: 120
    receipt_back: 100                        # 국내 원장 T−100 ~ T (결산배당 지급 50일 지연 + 정정)
    estimate_back: 100                       # 미국 추정 락일 T−100 ~ T−1
    held_back: 400                           # 조회 대상 = 400일 내 보유 이력 ∪ 원장 종목
  receipt_kinds: [kis_stock, kis_domestic_stock, kis_pension_fund, kis_cma_cash]
  us_withholding_rate: 0.15                  # 미국 배당 원천징수 (추정 원장)
  extra_kr_codes: []
  refresh_dashboard_views: false             # 배당이 성과 MV 에 들어가면 true

reference_ingest:                            # market_ingest_reference_daily (매일 06:55)
  market_index:                              # market.index_daily — 코스피·코스닥·S&P 500·나스닥 종합
    from_date: 2025-10-13                    # 신규 지수 첫 적재일 (보유 종목 시세 시작일과 맞춤)
    refetch_trading_days: 5                  # 매일 최근 n 거래일 재수집 (정정·누락)
    refresh_dashboard_views: false           # 지수가 대시보드 MV 에 들어가면 true
