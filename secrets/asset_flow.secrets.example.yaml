# secrets 템플릿 (커밋 대상, 실제 값 금지)
# 실제 파일: secrets/asset_flow.secrets.yaml (gitignore, 640, 서버 전용)
#
# 작성 규칙
#   - 숫자처럼 보이는 값(계좌번호·상품코드)은 "따옴표" 필수 (01 → 1 변환 방지)
#   - 날짜: YYYY-MM-DD
#   - id: 대문자·숫자·밑줄, 비밀 아님 (UI·로그·알림에 노출) → 계좌번호 일부 금지
#   - 해지 계좌는 삭제 대신 enabled: false
#   - 수정 후 검증: docker compose exec airflow-scheduler bash -c 'cd /opt/airflow/plugins && python -m asset_flow.secrets_config /opt/airflow/secrets/asset_flow.secrets.yaml'

version: 1

# ── 자격증명: 앱키 단위 = 토큰 발급 단위 = 만료 관리 단위 ──
# - 활성 계좌·services 가 참조하는 credential 만 토큰 발급
# - expires_on 기준 만료 알림 (D-14, D-7, D-3~매일)
# - 키 갱신 시 app_key·app_secret·expires_on 함께 교체
credentials:
  - id: KIS_STOCK
    provider: kis
    app_key: "<KIS_APPKEY_STOCK>"
    app_secret: "<KIS_APPSECRET_STOCK>"
    issued_on: 2026-03-31          # 선택. 포털에 표시된 신청일
    expires_on: 2027-03-31         # 필수. KIS Developers '신청현황' 만료일
    note: 위탁계좌 + 환율 조회     # 선택. 메모

  - id: KIS_ISA
    provider: kis
    app_key: "<KIS_APPKEY_ISA>"
    app_secret: "<KIS_APPSECRET_ISA>"
    expires_on: 2027-03-31
    note: ISA + CMA 공용

  - id: KIS_PENSION_DEDUCTIBLE
    provider: kis
    app_key: "<KIS_APPKEY_PENSION_DED>"
    app_secret: "<KIS_APPSECRET_PENSION_DED>"
    expires_on: 2027-05-01

  - id: KIS_PENSION_NON_DEDUCTIBLE
    provider: kis
    app_key: "<KIS_APPKEY_PENSION_NONDED>"
    app_secret: "<KIS_APPSECRET_PENSION_NONDED>"
    expires_on: 2027-08-27

  - id: UPBIT
    provider: upbit
    app_key: "<UPBIT_ACCESS_KEY>"
    app_secret: "<UPBIT_SECRET_KEY>"
    expires_on: 2027-01-15         # Upbit Open API 관리 만료일 (API expire_at 과 매일 대조)
                                   # 만료 없음이면 null (키 생략 불가)

  # 미사용 키는 넣지 않음 (넣어도 참조 없으면 미발급)

  # 공공데이터포털 특일정보 키 (휴장일 DAG, app_secret 없음)
  - id: DATA_GO_KR
    provider: data_go_kr
    app_key: "<DATA_GO_KR_SERVICE_KEY_DECODING>"
    expires_on: 2028-10-09         # 활용기간 종료일

# ── 계좌: 계좌번호 단위 ──
# kind 별 필드
#   kis_*      : credential, cano(8자리), product_code(2자리) 필수 / account_no, account_type 금지
#   upbit      : credential 필수 / 계좌번호 필드 금지
#   manual_*   : account_no, account_type 필수 / credential, cano, product_code 금지
#   fund_code  : (선택) kis_pension_fund·manual_fund, config 기본값과 다를 때만
# display_name = account_master.account_name (불일치 시 매일 CONFIG 알림)
# account_code 자동 생성: KIS "{cano}-{product_code}" / 수기 account_no / Upbit id → 업무 DB 값과 동일해야 함
accounts:
  - id: KIS_STOCK
    kind: kis_stock                # 해외 + 국내 잔고
    credential: KIS_STOCK
    cano: "00000000"
    product_code: "01"
    display_name: 위탁             # = account_master.account_name

  - id: KIS_ISA
    kind: kis_domestic_stock
    credential: KIS_ISA
    cano: "00000001"
    product_code: "00"
    display_name: 중개형ISA

  - id: KIS_PENSION_DEDUCTIBLE
    kind: kis_pension_fund
    credential: KIS_PENSION_DEDUCTIBLE
    cano: "00000002"
    product_code: "22"
    display_name: 연금저축(세액공제)

  - id: KIS_PENSION_NON_DEDUCTIBLE
    kind: kis_pension_fund
    credential: KIS_PENSION_NON_DEDUCTIBLE
    cano: "00000003"
    product_code: "22"
    display_name: 연금저축(비공제)
    # fund_code: "K553W5E17401"    # (선택) 이 계좌만 다른 펀드일 때

  - id: KIS_CMA
    kind: kis_cma_cash
    credential: KIS_ISA            # ISA 앱키·토큰 공유
    cano: "00000004"
    product_code: "00"
    display_name: CMA

  - id: UPBIT
    kind: upbit
    credential: UPBIT
    display_name: 가상자산

  - id: IRP
    kind: manual_fund              # 원장 좌수 × NAV
    account_type: IRP              # account_master.account_type
    account_no: "00000005-29"
    display_name: 저축IRP

  - id: DC
    kind: manual_fund
    account_type: DC
    account_no: "000-000-000006"
    display_name: 확정기여형DC

  - id: INSTALLMENT_SAVINGS
    kind: manual_cash              # 원장 원금 이월
    account_type: INSTALLMENT_SAVINGS
    account_no: "000-000-0000007"
    display_name: 청년미래적금

  - id: HOUSING_SUBSCRIPTION
    kind: manual_cash
    account_type: HOUSING_SUBSCRIPTION
    account_no: "000-0000-0000-08"
    display_name: 청년주택드림청약

  # 해지 계좌 예시 (삭제 대신 비활성화)
  # - id: KIS_OLD_ISA
  #   kind: kis_domestic_stock
  #   credential: KIS_ISA
  #   cano: "00000009"
  #   product_code: "00"
  #   display_name: 한국투자 ISA(해지)
  #   enabled: false

# ── 계좌가 아닌 용도의 키 참조 ──
services:
  exchange_rate_credential: KIS_STOCK   # 환율 조회용 KIS 키
  holiday_api_credential: DATA_GO_KR    # (선택) 휴장일 KASI 키, 생략 시 라이브러리만
