# secrets/asset_flow.secrets.example.yaml — 커밋하는 템플릿 (실제 값 금지)
#
# 실제 파일: secrets/asset_flow.secrets.yaml  (gitignore, chmod 640, 서버에만 둔다)
# 설계 근거: docs/airflow3_G_secrets_schema.md §7, docs/airflow3_H_key_expiry_alert.md
#
# 작성 규칙
#   1. 숫자처럼 보이는 값(계좌번호·상품코드)은 반드시 "따옴표"로 감싼다.
#      따옴표가 없으면 01 → 1, 00000000 → 0, 012345 → 5349(8진수)로 바뀌고 검증에서 거부된다.
#   2. 날짜는 YYYY-MM-DD. 따옴표는 있어도 없어도 된다.
#   3. id는 대문자·숫자·밑줄만 (예: KIS_ISA). id는 비밀이 아니다 — UI·로그·알림에 그대로 나온다.
#      id에 계좌번호 일부를 넣지 않는다.
#   4. 같은 id를 두 번 쓰거나, 정의되지 않은 필드(오타)를 쓰면 로드가 실패한다.
#   5. 계좌를 해지했으면 항목을 지우지 말고 enabled: false 로 둔다.
#   6. 수정한 뒤 반드시 검증한다 (README.md 참고):
#        docker compose exec airflow-scheduler python -m asset_flow.secrets_config /opt/airflow/secrets/asset_flow.secrets.yaml
#
# 이 템플릿 자체도 검증을 통과하도록 더미 값을 형식에 맞게 넣었다(CI 스키마 회귀 테스트 입력).

version: 1

# ── 자격증명: 앱키 단위 = 토큰 발급 단위 = 만료 관리 단위 ──────────────────────
# id는 토큰 딕셔너리 키가 된다. 활성 계좌나 services가 참조하는 credential만 토큰을 발급한다.
# expires_on 기준으로 D-14, D-7, D-3부터 매일(만료 후 포함), 구간 내 월요일에 Discord 알림이 간다.
# 키를 갱신하면 app_key·app_secret·expires_on 세 값을 한 번에 바꾼다.
credentials:
  - id: KIS_STOCK
    provider: kis
    app_key: "<KIS_APPKEY_STOCK>"
    app_secret: "<KIS_APPSECRET_STOCK>"
    issued_on: 2026-03-31          # 선택. 포털에 표시된 신청일
    expires_on: 2027-03-31         # 필수. KIS Developers '신청현황'의 만료일 (조회 API 없음 → 직접 기재)
    note: 위탁계좌 + 환율 조회     # 선택. 메모

  - id: KIS_ISA
    provider: kis
    app_key: "<KIS_APPKEY_ISA>"
    app_secret: "<KIS_APPSECRET_ISA>"
    expires_on: 2027-03-31
    note: ISA + CMA 공용

  - id: KIS_PENSION_DEDUCTIBLE
    provider: kis
    app_key: "<KIS_APPKEY_PENSION_DED>"
    app_secret: "<KIS_APPSECRET_PENSION_DED>"
    expires_on: 2027-05-01

  - id: KIS_PENSION_NON_DEDUCTIBLE
    provider: kis
    app_key: "<KIS_APPKEY_PENSION_NONDED>"
    app_secret: "<KIS_APPSECRET_PENSION_NONDED>"
    expires_on: 2027-08-27

  - id: UPBIT
    provider: upbit
    app_key: "<UPBIT_ACCESS_KEY>"
    app_secret: "<UPBIT_SECRET_KEY>"
    expires_on: 2027-01-15         # Upbit Open API 관리 화면의 만료일. 매일 GET /v1/api_keys 의 expire_at과 대조된다
                                   # 만료가 없다고 확인한 키는 null (키 자체는 생략 불가)

  # 사용하지 않는 키(예: 예전 KIS_IRP)는 넣지 않는다.
  # 넣더라도 참조하는 계좌가 없으면 발급하지 않으므로, 그 키가 만료돼도 다른 수집은 멈추지 않는다.

  # (예정) 공공데이터포털 특일정보 API 키 — 휴장일 DAG(docs/handoff/market_holiday_handoff.md §2-2)
  # 로더 스키마에 provider 'data_go_kr'를 추가한 뒤 주석을 푼다. 활용기간 만료일을 적으면 만료 알림에 포함된다.
  # - id: DATA_GO_KR
  #   provider: data_go_kr
  #   app_key: "<DATA_GO_KR_SERVICE_KEY_DECODING>"
  #   app_secret: "<UNUSED>"
  #   expires_on: 2028-10-09       # 공공데이터포털 마이페이지 > 활용신청 현황의 활용기간 종료일

# ── 계좌: 계좌번호 단위 ────────────────────────────────────────────────
# 순서 = 처리·표시 순서. kind에 따라 필요한 필드가 다르다.
#   kis_*      : credential, cano(8자리), product_code(2자리) 필수 / account_no, account_type 금지
#   upbit      : credential 필수 / 계좌번호 필드 금지
#   manual_*   : account_no, account_type 필수 / credential, cano, product_code 금지
# account_code(업무 DB 키)는 자동으로 만들어진다:
#   KIS = "{cano}-{product_code}", 수기 계좌 = account_no 원문, Upbit = id ('UPBIT')
# → 업무 DB(account.asset_daily, account_master)의 값과 글자 하나까지 같아야 한다.
accounts:
  - id: KIS_STOCK
    kind: kis_stock                # 해외 + 국내 잔고
    credential: KIS_STOCK
    cano: "00000000"
    product_code: "01"
    display_name: 한국투자 위탁    # asset_daily.account_name 으로 적재되는 표시명

  - id: KIS_ISA
    kind: kis_domestic_stock
    credential: KIS_ISA
    cano: "00000001"
    product_code: "00"
    display_name: 한국투자 ISA

  - id: KIS_PENSION_DEDUCTIBLE
    kind: kis_pension_fund
    credential: KIS_PENSION_DEDUCTIBLE
    cano: "00000002"
    product_code: "22"
    display_name: 연금저축(세액공제)

  - id: KIS_PENSION_NON_DEDUCTIBLE
    kind: kis_pension_fund
    credential: KIS_PENSION_NON_DEDUCTIBLE
    cano: "00000003"
    product_code: "22"
    display_name: 연금저축(비공제)

  - id: KIS_CMA
    kind: kis_cma_cash
    credential: KIS_ISA            # CMA는 ISA 앱키·토큰을 공유한다 (ISA 키를 바꾸면 CMA도 함께 바뀐다)
    cano: "00000004"
    product_code: "00"
    display_name: 한국투자 CMA

  - id: UPBIT
    kind: upbit
    credential: UPBIT
    display_name: 업비트

  - id: IRP
    kind: manual_fund              # 원장 좌수 × NAV
    account_type: IRP              # account_master.account_type
    account_no: "00000005-29"
    display_name: 저축IRP

  - id: DC
    kind: manual_fund
    account_type: DC
    account_no: "000-000-000006"
    display_name: 확정기여형DC

  - id: INSTALLMENT_SAVINGS
    kind: manual_cash              # 원장 원금 이월
    account_type: INSTALLMENT_SAVINGS
    account_no: "000-000-0000007"
    display_name: 청년미래적금

  - id: HOUSING_SUBSCRIPTION
    kind: manual_cash
    account_type: HOUSING_SUBSCRIPTION
    account_no: "000-0000-0000-08"
    display_name: 청년주택드림청약

  # 해지·보류 계좌 예시 — 지우지 말고 비활성화한다 (과거 적재 데이터와의 연결 유지)
  # - id: KIS_OLD_ISA
  #   kind: kis_domestic_stock
  #   credential: KIS_ISA
  #   cano: "00000009"
  #   product_code: "00"
  #   display_name: 한국투자 ISA(해지)
  #   enabled: false

# ── 계좌가 아닌 용도의 키 참조 ─────────────────────────────────────────
services:
  exchange_rate_credential: KIS_STOCK   # fetch_exchange_rate 가 쓰는 KIS 키 (KIS credential id여야 함)
